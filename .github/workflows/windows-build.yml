name: Windows Native Build

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

# env:
  # Use the runner's workspace directory with a backslash
  # VCPKG_ROOT: ${{ github.workspace }}\vcpkg
  
jobs:
  build-windows:
    runs-on: windows-2022

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Install System Dependencies (pkgconf Host Tool)
      run: |
        choco install pkgconfiglite gperf
      shell: powershell

        
    - name: mkdir build/
      run: |
        cd ${{ github.workspace }}
        mkdir build -force

    - name: Run vcpkg (Installs & Caches Dependencies)
      uses: lukka/run-vcpkg@v11
      env:
        ACTIONS_CACHE_URL: ${{ env.ACTIONS_CACHE_URL }}
        ACTIONS_RUNTIME_TOKEN: ${{ env.ACTIONS_RUNTIME_TOKEN }}
      with:
        vcpkgJsonGlob: '**/vcpkg.json'

    - name: Configure CMake
      run: |
        cmake -B build -S . `
          -DCMAKE_TOOLCHAIN_FILE=${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake `
          -DVCPKG_TARGET_TRIPLET=x64-windows

    - name: Build Project
      continue-on-error: true
      run: |
        cmake --build build --config Release
        
    - name: Debug vcpkg / cairo
      continue-on-error: true
      run: |
        vcpkg list

    - name: Upload Build Output
      uses: actions/upload-artifact@v4
      continue-on-error: true
      with:
        name: publisher_convert-windows-x64-r${{ github.run_number }}
        path: build/
