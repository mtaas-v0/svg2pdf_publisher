name: Windows Native Build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-windows:
    runs-on: windows-2022

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4


    # Step 1: Cache vcpkg artifacts (Keep your existing step)
    - name: Cache vcpkg artifacts
      uses: actions/cache@v4
      with:
        path: ${{ github.workspace }}/vcpkg_cache
        key: ${{ runner.os }}-vcpkg-${{ hashFiles('vcpkg.json') }}
        restore-keys: ${{ runner.os }}-vcpkg-

    - name: Downloading Vcpkg 📥
      run: |
        cd ${{ github.workspace }}
        mkdir build -force
        git clone https://github.com/Microsoft/vcpkg.git
        cd vcpkg
        .\bootstrap-vcpkg.bat

    - name: Install System Dependencies via vcpkg
      run: |
        vcpkg install --triplet x64-windows
      shell: cmd

    - name: Configure CMake
      run: |
        cmake -B build -S . `
          -DCMAKE_TOOLCHAIN_FILE=C:/vcpkg/scripts/buildsystems/vcpkg.cmake `
          -DVCPKG_TARGET_TRIPLET=x64-windows
      shell: pwsh

    - name: Build Executable
      run: |
        cmake --build build --config Release
      shell: pwsh

    - name: Upload Build Output
      uses: actions/upload-artifact@v4
      with:
        name: publisher_convert-windows-x64
        path: build/Release/publisher_convert.exe
